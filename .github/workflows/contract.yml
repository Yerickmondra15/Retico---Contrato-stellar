name: ReTico

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CARGO_PROFILE_DEV_DEBUG: '0'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Instalar Rust y el target Wasm
        run: |
          rustup toolchain install 1.100.0 --profile minimal --component rustfmt --target wasm32v1-none
          rustup override set 1.100.0
      - name: Instalar Stellar CLI 30.0.1
        run: |
          curl --fail --silent --show-error --location \
            https://github.com/stellar/stellar-cli/releases/download/v30.0.1/stellar-cli-30.0.1-x86_64-unknown-linux-gnu.tar.gz \
            --output "$RUNNER_TEMP/stellar.tar.gz"
          echo "48c70074020e09af0a3ebbd2bf62d53c9aec47935e49a112d3cd90fb4e37658f  $RUNNER_TEMP/stellar.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/stellar.tar.gz" -C "$RUNNER_TEMP" stellar
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace --locked
      - run: stellar contract build --locked

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.22.3'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
