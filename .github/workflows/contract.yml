name: Contrato Soroban

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CARGO_PROFILE_DEV_DEBUG: '0'
    steps:
      - uses: actions/checkout@v4
      - name: Instalar Rust y el target Wasm
        run: |
          rustup toolchain install 1.100.0 --profile minimal --component rustfmt --target wasm32v1-none
          rustup override set 1.100.0
      - name: Instalar Stellar CLI 30.0.1
        run: |
          curl --fail --silent --show-error --location \
            https://github.com/stellar/stellar-cli/releases/download/v30.0.1/stellar-cli-30.0.1-x86_64-unknown-linux-gnu.tar.gz \
            --output "$RUNNER_TEMP/stellar.tar.gz"
          tar -xzf "$RUNNER_TEMP/stellar.tar.gz" -C "$RUNNER_TEMP" stellar
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace --locked
      - run: stellar contract build --locked
